name: commerce_analytics
version: 1.0.0
config-version: 2
profile: commerce_analytics
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]
vars:
  'dbt_date:time_zone': 'America/Los_Angeles'
models:
  commerce_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
snapshots:
  commerce_analytics:
    +target_schema: snapshots
seeds:
  commerce_analytics:
    +schema: raw
