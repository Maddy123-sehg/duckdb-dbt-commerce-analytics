version: 2
sources:
  - name: raw
    description: Seeded extracts that simulate files landed by an upstream commerce application.
    schema: analytics_raw
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after: {count: 48, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: raw_customers
        description: Customer master records from the commerce application.
      - name: raw_orders
        description: Order headers including lifecycle status.
      - name: raw_order_items
        description: Product-level financial detail for each order.
