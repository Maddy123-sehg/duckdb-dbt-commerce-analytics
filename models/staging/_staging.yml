version: 2
models:
  - name: stg_customers
    description: Clean, typed customer records.
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Mid-Market', 'Enterprise']
  - name: stg_orders
    description: Clean, typed order headers at one row per order.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'cancelled']
  - name: stg_order_items
    description: Clean, typed order line items.
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

